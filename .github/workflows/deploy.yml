
name: Deploy Rokz Editz Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rokz-editz-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Validate website
        run: |
          test -s index.html
          test -d images
          test -d videos

      - name: Copy files to staging
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            'mkdir -p ~/rokz-editz-deploy'

          rsync -av --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            index.html images/ videos/ \
            "$SSH_USER@$SSH_HOST:rokz-editz-deploy/"

      - name: Deploy to Nginx
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            'set -e
             sudo rsync -a --chown=www-data:www-data \
               ~/rokz-editz-deploy/index.html \
               ~/rokz-editz-deploy/images/ \
               ~/rokz-editz-deploy/videos/ \
               /var/www/html/
             sudo nginx -t
             sudo systemctl reload nginx
             echo "Deployment successful"'
sudo rsync -a --delete --chown=www-data:www-data \
  ~/rokz-editz-deploy/ \
  /var/www/html/
      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
